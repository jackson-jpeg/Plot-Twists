# PlotSlop — nginx site config for plotslop.com
#
# STAGED, NOT INSTALLED. Copying this into /etc/nginx/sites-enabled/ is a step in
# scripts/cutover.sh, which does nothing without --apply.
#
# Install order matters: this file references a certificate that does not exist until
# certbot has run, so nginx will refuse to start with it in place on a fresh box. Use
# plotslop.com.bootstrap.conf first, get the certificate, then swap to this. cutover.sh
# does exactly that, in that order.
#
# Upstream is 127.0.0.1:3100 (PORT in /etc/plotslop/env). sanger-next holds 3000 on the
# same box — do not collide with it.

# ── Connection header for WebSocket upgrade ──────────────────────────────────
#
# WHY A MAP AND NOT A LITERAL. The neighbouring sang3r.com config sets
# `proxy_set_header Connection "upgrade"` unconditionally. That works for WebSockets but
# sends `Connection: upgrade` on ORDINARY requests too, which is a lie to the upstream and
# breaks keep-alive reuse. The map sends "upgrade" only when the client actually asked to
# upgrade, and "close" otherwise.
#
# The variable is namespaced. A map defines a variable in the http block, and nginx fails
# to load if two site files define the same name — so a generic `$connection_upgrade` here
# would break the day someone adds a second WebSocket site.
map $http_upgrade $plotslop_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    server_name plotslop.com www.plotslop.com;

    # Both address families. The box has a global IPv6 address and nginx already listens on
    # it for sang3r.com. If plotslop.com gets an AAAA record and nginx is NOT listening on
    # v6, HTTP-01 validation will be attempted over v6 and fail, while everything looks fine
    # over v4 — a renewal failure two months later with no obvious cause.
    listen 187.77.218.14:443 ssl;
    listen [2a02:4780:4:1c0b::1]:443 ssl;

    ssl_certificate     /etc/letsencrypt/live/plotslop.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/plotslop.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ── Socket.IO ────────────────────────────────────────────────────────────
    #
    # Separate location because the timeouts here are load-bearing in a way the app's are
    # not, and getting them wrong fails ONLY under real use: a smoke test opens a socket,
    # sends a message, sees a reply and passes, while a real game drops every player
    # mid-performance when a connection idles past the timeout. That failure arrives as
    # "everyone got disconnected during the show" and is close to unreproducible.
    #
    # Socket.IO's own pingInterval/pingTimeout defaults are 25s/20s, so any proxy read
    # timeout above ~45s is survivable; 600s leaves the app's heartbeat entirely in charge
    # of deciding a connection is dead, rather than having nginx and Socket.IO race.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $plotslop_connection_upgrade;
        proxy_set_header Host $host;

        # X-Real-IP is what server/utils/clientIdentity.ts prefers for rate-limit keying,
        # because unlike X-Forwarded-For a client cannot prepend to it. Removing this line
        # silently collapses every player into one rate-limit bucket (all traffic arrives
        # from 127.0.0.1) and the first busy evening locks people out.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Buffering must be off or the upgrade handshake and every frame get held.
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $plotslop_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;

        # Script generation streams for up to CONFIG.generation.timeoutMs (120s default).
        # A shorter proxy timeout here would cut the stream and surface as
        # SCRIPT_GENERATION_FAILED with the credit refunded — a bug that only appears on
        # long generations.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 25M;
    }

    # Let certbot's webroot renewals through without touching the app.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

server {
    listen 187.77.218.14:80;
    listen [2a02:4780:4:1c0b::1]:80;
    server_name plotslop.com www.plotslop.com;

    # ACME first, redirect second — order matters, or renewals get 301'd to https and
    # HTTP-01 validation fails on a host that is otherwise working perfectly.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
