# PlotSlop — port-80-only bootstrap config.
#
# STAGED, NOT INSTALLED.
#
# This exists because of a chicken-and-egg that bites everyone once: the real config
# (plotslop.com.conf) names /etc/letsencrypt/live/plotslop.com/fullchain.pem, and nginx
# refuses to LOAD — not just refuses to serve, refuses to load, taking sang3r.com down with
# it — if that file is absent. So it cannot be installed before the certificate exists, and
# the certificate cannot be issued without nginx answering on port 80 for this name.
#
# Install this first, obtain the certificate, then swap in the real config.
# scripts/cutover.sh does that in order.

server {
    listen 187.77.218.14:80;
    listen [2a02:4780:4:1c0b::1]:80;
    server_name plotslop.com www.plotslop.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # No redirect to https yet — there is nothing to redirect to.
    location / {
        return 200 'plotslop: awaiting certificate\n';
        add_header Content-Type text/plain;
    }
}
